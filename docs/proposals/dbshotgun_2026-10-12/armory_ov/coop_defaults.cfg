seta coop_aiRetailProne 1
seta coop_aiVariantChance "35"
seta coop_aiG43Chance "15"
seta coop_aiHitReact "55"
seta coop_aiHitReactWait "1.2"	// seconds between flinches per man
// [2026-08-21] `set`, not `seta`: a diagnostic that archives survives a restart and leaves
// debug spam on forever with nothing obvious to turn it off (TRAPS T7).
set coop_hitReactDebug "0"	// 1 = print HITREACTMAP loc=.. sfx=.. per flinch
seta coop_aiCrateFight "35"
seta coop_aiCrawlDeathChance "30"
seta coop_aiCrouchChance "30"
seta coop_aiRetailCrouch "1"
seta coop_impactSnap "1"
seta coop_impactSnapDist "200"
seta coop_bloodSpurtUp "75"
seta coop_explosionShake "1"
seta coop_vehicleScreams "1"
seta coop_ricochet "1"
seta coop_dizzyTime "10"
seta coop_aiProneDwell "10"
seta coop_surrenderRecruit "1"
seta coop_goreChunks "1"
seta coop_corpseImpulse "1"
seta coop_eyeGib "1"

// [user 2026-08-20] dynamic reload feel - the camera follows the REAL length of each
// weapon's reload animation instead of a fixed 900ms, so a bolt rifle and a Garand no
