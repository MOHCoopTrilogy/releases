// ===== ADVANCED GRAPHICS + OPTIONS (synced to the author's tuned values 2026-07-17; user config still overrides) =====
seta r_ext_max_anisotropy 16
seta r_ext_texture_filter_anisotropic 1
// ANTI-ALIASING (Advanced Graphics -> Anti-Aliasing), gfx flip 2026-10-04: r_msaa -1 = the engine's Auto (8x on strong
// cards, see renderergl2/tr_msaa_decide.h). The new gl2 path resolves cutouts with alpha-to-coverage, which is what
// closes bug-1298. Seeded -1, not 8, so a later Auto change still reaches every saved config (TRAPS T7). The OLD
// cvars below are pinned 0 and must stay 0: r_ext_multisample is window MSAA that gl2 blits into (bug-3119), and
// r_ext_framebuffer_multisample only drives the legacy path (r_msaaOverride legacy), which still draws the halos.
seta r_msaa -1
seta r_ext_multisample 0
seta r_ext_framebuffer_multisample 0
seta r_swapInterval 1
seta r_overBrightBits 0
seta r_subdivisions 4
seta r_flares 1
seta r_drawSun 1
seta r_fastdlights 0
seta cg_marks_max 487.050842
seta ter_maxlod 6
seta ter_error 4
seta ui_crosshair 1
seta ui_weaponsbar 1
seta g_subtitle 0
