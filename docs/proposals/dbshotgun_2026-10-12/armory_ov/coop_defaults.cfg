// [user 2026-09-04] THE RENDERER. "No players should be loading into gl1."
// cl_main.cpp:3231 defaults cl_renderer to "opengl1", and nothing in this mod ever changed it - the
// gl2 install was reached only by a PLAY-GL2.bat that lives on one machine and has never been part
// of the release. So every fresh install ran gl1 and lost the whole gl2 visual layer: measured on
// 2026-09-04, a second player on the same build loaded renderer_opengl1 and saw the Omaha water as
// CLEAR, because the underwater pass (RB_HZMExtraFx / underwater_fp.glsl) is renderergl2-only.
// Seeded here so a new install is correct and the player can still change it afterwards; autoexec
