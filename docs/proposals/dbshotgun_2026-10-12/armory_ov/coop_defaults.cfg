seta r_gamma 1.176255

// ===== [2026-09-27] GRAPHICS MENU PHASE 1 (bug-3115..3121; docs/proposals/graphics_menu_2026-09-27/plan.md) =====
// FRAME RATE LIMIT (Advanced Graphics -> Display). com_maxfps used to be FORCED to 180 by autoexec.cfg every
// launch (no choice possible; 180 really ran at 200, whole-millisecond pacing). The row owns it now. The pick is
// kept twice: in com_maxfps, and in the ALIAS coop_fpsRestore, which autoexec.cfg runs at every launch - so the
// host pacing cap (start_server.cfg: 125 while THIS machine hosts, bug-1673) never outlives the session. The
// alias here is only the default: the saved config (it stores aliases, and loads after this file) replaces it
// with the player's pick. An alias because a server can neither write nor run one (qcommon/cmd_filter.c).
seta com_maxfps 200
alias coop_fpsRestore "seta com_maxfps 200"
// MENU LAYOUT (Advanced Graphics -> Display): 0 = Stretched (menus fill the screen, the 07-27 verdict), 1 = Centred.
seta ui_menuCenter 0
// REAL DYNAMIC LIGHTING (vanilla Advanced panel) now drives gl2's r_dynamiclight (0 drops every dynamic light,
// renderergl2/tr_scene.c:529-534). The old r_fastdlights is gl1-only (bug-3038/3099).
seta r_dynamiclight 1
// ONE-TIME GRAPHICS REPAIR #1: armed here, run once by autoexec.cfg, disarmed in the saved config by the last line
// of coop_mod/cfg/coop_gfxfix1.cfg (generated). Re-pins what the old engine-default DEFAULT buttons and the
// installer snapshot left broken, and only cvars no menu offers any more (gen_menu_graphics.py PINNED).
alias coop_gfxFix1 "exec coop_mod/cfg/coop_gfxfix1.cfg"
// ONE-TIME BIND CLEANUP #1 (bug-3190): same shape - armed here, run once by autoexec.cfg, disarmed in the saved config
// by the last line of coop_mod/cfg/coop_bindfix1.cfg. Takes the old developer test binds back out of saved configs.
alias coop_bindFix1 "exec coop_mod/cfg/coop_bindfix1.cfg"
// ONE-TIME HUD CLEANUP #1 (bug-3209): same shape - armed here, run once by autoexec.cfg, disarmed in the saved
// config by the last line of coop_mod/cfg/coop_hudfix1.cfg. Hides the blinking "slow server" icon (cg_drawsvlag 0).
alias coop_hudFix1 "exec coop_mod/cfg/coop_hudfix1.cfg"
// ONE-TIME BIND CLEANUP #2 (bug-3299): same shape - armed here, run once by autoexec.cfg, disarmed in the saved config
// by the last line of coop_mod/cfg/coop_bindfix2.cfg. Takes the developer ADS-tuning numpad binds out of saved configs.
alias coop_bindFix2 "exec coop_mod/cfg/coop_bindfix2.cfg"
// ONE-TIME QUICK-DRAW TIMING #1 (user 2026-10-05): same shape - armed here, run once by autoexec.cfg, disarmed in the
// saved config by the last line of coop_mod/cfg/coop_qdrawfix1.cfg. Moves existing profiles to 0.18/0.25/0.30 once.
alias coop_qdrawFix1 "exec coop_mod/cfg/coop_qdrawfix1.cfg"
// ARMORY DONE (bug-3299): the DONE button runs ui/loadout/fitunbind.cfg every time, which now just calls this alias.
// It is empty unless ui/loadout/fitbinds.cfg (the developer fit-tune keys) armed it, so closing the Armory no longer
// unbinds the player's numpad 3/9, arrow keys and [ ] ; - = ' , . \ (medkit, cover, ammo box...).
alias coop_fitUnbind ""
// SUN RAYS: the Post-FX row is hidden (ao_sunrays_2026-09-27 D3 - no coop map shows a visible sun under our fog, and
// the rays glowed as a square on fogged skies). Off, and pinned there by the DEFAULTS cfg and the repair above.
seta r_drawSunRays 0
// LIGHTNING (Post-FX -> Atmosphere): 1 Normal / 2 Reduced flashing / 0 Off (thunder only). Lightning plan D6.
seta cg_hzmLightningMode 1
// WATER REFLECTIONS / WET IN RAIN (Advanced Graphics -> Water & Weather), on by default since v1.10.3 (water plan D7).
// -1 = the engine's AUTO (renderercommon/hzm_waterwet.h, now 1), deliberately not 1: a later AUTO change then still
// reaches every saved config that holds this seed (TRAPS T7). Omaha is excluded in the engine by map name.
seta r_hzmWater -1
seta r_hzmWet -1
// GROUND VARIETY (Advanced Graphics -> Textures & Lighting): -1 = the engine's AUTO (tr_hzm_groundvar.c, now 0 = OFF).
// Seeded -1, not 0, for the same TRAPS T7 reason. Omaha is excluded in the engine by map and asset name.
seta r_groundVariety -1
// VIDEO MEMORY GAUGE (Options -> Video, the lamp dial; gl2 only): -1 = the engine's AUTO (tr_hzm_vram.c, now 1 = ON),
// 0 off, 1 on. Seeded -1 for the same TRAPS T7 reason. It reads the card only while the Video panel is on screen.
seta r_hzmVramBar -1

