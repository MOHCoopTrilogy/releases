// This file is exec'd on DEDICATED boots too (qcommon/common.c Com_Init, unconditional; the file is
// in the code pak) - so this 0 reaches harness servers as well, not only listen clients.
set coop_probe 0
set coop_probeInterval 10
set coop_probeFilter ""
// [user 2026-09-27] console quiet - two ENGINE probes whose code default is 1, seeded off here so
// the change lands with a pak build and no engine rebuild (both are flags-0 Cvar_Get sites, so the
// engine keeps a value a cfg set first - the bug-1669 mechanism, used on purpose).
//   s_voxProbe  - ^~^~^ VOXSTART, one line per dialogue line started (bug-2449 hunt, fixed).
//   s_poolProbe - ^~^~^ SNDPOOL, the sound-pool gauge every 5 s (bug-2457). 1 = back on.
set s_voxProbe 0
set s_poolProbe 0

// ============================================================================
// QUICK GRENADE  [user 2026-08-24]
// ============================================================================
// Tap G to throw a grenade without hand-selecting it; HOLD to charge (it goes further)
// and to cook it (shorter fuse - hold too long and it goes off in your hand, which is
// stock engine behaviour, not something added here). Releases back to the gun you were
// holding.
//
// A BIND, and it lives HERE rather than in autoexec.cfg on purpose: this file execs BEFORE
// the saved config, so a player who rebinds G keeps their choice. autoexec execs AFTER and
// would re-force this every launch, silently wiping their rebind - the exact problem this
// file was split out to fix.
//
// "+coopnade" / "-coopnade" are server console commands (fgame/gamecmds.cpp). They are not a
// usercmd button bit because there are none left - bits 0-6 stock, 7-11 the weapon-command
// field, 12 COOPWALK, 13 COOPADS (recorded as the last free one), 14-15 ANY/MOUSE.
// coop_quickNade 0 disables the whole feature.
// !! DO NOT PUT BINDS IN THIS FILE. !!  [2026-08-24 - learned the hard way]
// This file execs BEFORE configs/omconfig.cfg (qcommon/common.c:1841 then :1847), and that saved
// config starts with UNBINDALL - so any bind seeded here is wiped every single launch. The bind
// went to autoexec.cfg, which execs AFTER the config (:1862). That is why all 40 of the project's
// binds already live there; it was not an accident.
// The before-the-config ordering is still exactly right for `seta` CVARS, which is what this file is for.

// ============================================================================================
// QUICK-DRAW SIDEARM  [user 2026-09-04]
//
// Hold H (bound in autoexec.cfg - NOT here, see the warning above) with a rifle/SMG/MG out: the
// long gun swings onto the left-hand tag and the pistol comes up in coop_qdrawDelay seconds. You
// get exactly one clip; on empty, on reload, or on release the primary comes back - still empty,
// still owing you its reload. That is the price, and it is the point.
//
// If the primary is already reloading, the draw CANCELS the reload instead of refusing - so the
// window is the whole reload animation (2.0 s Garand, 3.3 s Kar98), not the ~200 ms before the game
// auto-reloads for you. It will NOT cancel a magazine reload that has already seated the magazine:
// that would be a free 50% reload on bolt guns.
//
// Faster than both alternatives, measured from the retail animation clips:
//     quick draw 0.180 s  |  manual swap 0.767-1.067 s  |  reload 2.000-3.333 s
// [user 2026-10-05] retimed 0.25/0.40/0.60 -> 0.18/0.25/0.30 with the new draw motion (cgame cg_qdrawmotion.c): measured
// in-engine the pistol is in the sight picture 0.13-0.16 s after the press and a manual switch takes 0.67-1.0 s to the
// pistol and 1.1-1.7 s back. Existing profiles get the new values once via coop_qdrawFix1 (below).
//
// Every value here matches the engine default registered in CoopQDrawRegisterCvars
// (fgame/player.cpp). They are seeded as `seta` so a Coop Settings change persists; this file
// execs BEFORE the saved config, so these are true defaults a menu change overrides.
// ============================================================================================
seta coop_qdraw 1               // master switch. 0 = feature off entirely
seta coop_qdrawDelay 0.18       // key-down -> pistol fire-ready, seconds (clamped 0..1)
seta coop_qdrawReturn 0.25      // exit -> primary fire-ready, seconds (clamped 0..2)
seta coop_qdrawMinHold 0.30     // a shorter tap still gives the draw; release-exit arms after this
seta coop_qdrawMaxHold 12       // hard timeout in seconds
seta coop_qdrawSticky 0         // 1 = latch until the clip is empty, ignore the key release
seta coop_qdrawClasses 14       // eligible weaponclass mask: 14 = RIFLE|SMG|MG. 46 adds HEAVY
seta coop_qdrawShowPrimary 1    // 0 = hide the parked gun (the one-cvar escape if the pose looks wrong)
seta coop_qdrawParkOfs "-6 5 -4"  // park offset along the tag's forward/left/up
seta coop_qdrawParkAng "0 0 -25"  // park angles, composed with the tag rotation

// ============================================================================================
// CONTROLLER (gamepad) DEFAULTS  [controller support, 2026-09-20]
// seta CVARS live HERE (before the saved config, so a Controls-menu change overrides + persists).
// The BINDS themselves are in autoexec.cfg (the UNBINDALL warning above is why). in_joystick stays
// the engine default (0/off) so nothing changes for keyboard players and the bug-2606 boot-enumeration
// hang is not re-armed; a controller is turned on from Options > Controls (in_joystick 1 ; in_restart).
// ============================================================================================
seta in_joystickUseAnalog 1     // analog sticks (not digital 8-way) - required for smooth move/look
seta joy_threshold 0.15         // inner dead-zone (engine default; exposed for tuning)
// The four below are read by the input-feel engine work (not yet in the shipped exe); pre-seeded so a
// controller build adopts them immediately and a Controls slider has a sensible starting value.
seta joy_response 1.5           // look response curve exponent (1 = linear; higher = finer near-centre aim)
seta joy_outerThreshold 0.02    // outer dead-zone (saturate to full past this) - kills stick-max jitter
seta coop_padLookScale 1.0      // one master look-sensitivity multiplier for the sticks
// Aim assist is COOP-ONLY and OFF by default (a prominent Controls checkbox turns it on). The engine
// gate makes it inert in multiplayer regardless of this cvar (coop_mainScriptLoaded present + coop_mpRun
// absent), so it can never affect PvP. Read by the game.dll aim-assist work (not yet in the shipped dll).
seta coop_aimAssist 0           // 0 = off, 1 = on (coop only)
seta coop_aimAssistFov 8        // assist cone half-angle (degrees)
seta coop_aimAssistRange 2048   // max assist range (units)
seta coop_aimAssistPull 0.15    // magnetism strength (fraction toward target / frame)
seta coop_aimAssistFriction 0.5 // look slowdown near a target (1 = none)
seta coop_qdrawCooldown 0       // seconds of friction after an early release. 0 = none
seta coop_qdrawInterrupt 1      // 1 = the draw cancels a running primary reload. 0 = refuse instead

// HANDLING FOLEY. Four beats per draw, from the coop_gf_* library that already ships - no new audio.
// These two are CLIENT cvars (registered in cgame/cg_view.c, not in CoopQDrawRegisterCvars), because
// the sound is 2D and local: it is the sound of YOUR hands, heard by nobody else.
seta coop_qdrawFoley 1          // 0 = silence the four handling beats and nothing else
seta coop_qdrawFoleyGap 0.08    // seconds between the two beats of a transition (clamped 0.02-0.40)

// LIGHTNING [2026-09-27, bug-3108] moved here from autoexec.cfg so a 0 persists. SERVER-side (the host's choice):
// 0 = thunder only - no screen sheet, and under the lightning quick fix (coop_ltQuick 1) no fog pulse either.
seta coop_dynWeatherLightning 1

// DUST STORM ROLL-IN [2026-09-26, bug-2963] (coop_mod/duststorm.scr): on the sand maps a full storm closes the
// fog and fades a sand sheet + strong wind over your view. 0 = storms only draw the streaks, as before.
// coop_dustNow (1 force / 0 off / empty = follow the weather) is a test override and deliberately NOT seeded here.
seta coop_dust 1
// STORM FREQUENCY [2026-09-28] (duststorm.scr coop_dust_walkBias). SERVER cvars, the host's choice. -1 = AUTO (the
// script's own default), deliberately not the number: a later AUTO change then reaches every saved config (TRAPS T7).
//   coop_dustFull     chance a sand-map storm is a FULL storm, not a haze (0..1; 0 = hazes only)    AUTO 0.7
//   coop_dustDry      dry spells between sand storms, x the weather's own (0.1..1)                  AUTO 0.5
//   coop_dustFullCool seconds after a full storm before the next may be full (else it is a haze)   AUTO 300
seta coop_dustFull -1
// BLIZZARD / TORRENTIAL DOWNPOUR (coop_mod/wxextreme.scr) - the tier above intensity 3 on snow and rain maps.
//   coop_wxExtreme        1 on / 0 off (intensity 3 stays the top)
//   coop_wxExtremeChance  chance a storm is an EXTREME one (0..1)                                      AUTO 0.25
//   coop_wxExtremeCool    seconds after one ended before the next storm may be extreme                 AUTO 420
// coop_wxNow (1 force / 0 off / empty = follow the weather) and coop_weatherPin 4 are test overrides, not seeded.
seta coop_wxExtreme 1
seta coop_wxExtremeChance -1
seta coop_wxExtremeCool -1
seta coop_dustDry -1
seta coop_dustFullCool -1

// LOADING SCREEN [user 2026-09-26] (ui/loadingbar.txt; docs/proposals/loading_screen_2026-09-26/research.md).
// All plain `set`, never seta: session values owned by the loading screen / the exe, none may latch in a saved config.
// ui_loadIconScale must EXIST before the menus are parsed (scalecvar is a Cvar_Find) and must STAY 1: it scales the
//   medal's position as well as its size. Without it an old exe draws the medal stretched (an ellipse on widescreen).
// ui_loadClassic 1 = the stock loading bar / flasher again at the next load (the A/B). Resets to 0 every launch.
// ui_loadHintsOn shows the hint strip; a new exe republishes it at every load from ui_loadHints (-1 auto / 0 / 1).
// ui_loadhint is the ONE hint an old exe shows; a new exe overwrites it at every load from ui/loadhints.txt.
//   It must be true on coop AND MP loads, so it is the aim-down-sights tip [user 2026-09-27] (the old F7 line was
//   wrong for MP: F7 there can open the coop armory).
set ui_loadIconScale 1
set ui_loadClassic 0
set ui_loadHintsOn 1
set ui_loadhint "Hold right mouse to aim down the sights for much tighter shots."
