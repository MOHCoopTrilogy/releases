// ============================================================================
// HZM Coop - CURATED OPTION DEFAULTS  (GENERATED: scratchpad/split_options_persist.py)
// 
// The engine execs this file BEFORE the saved config (qcommon/common.c: after default.cfg,
// before configs/<player>.cfg), so these are only DEFAULTS: the player's saved config loads
// AFTER and overrides any option they changed in the menus -> option changes now PERSIST across
// restarts. (Previously these lived in autoexec.cfg, which runs AFTER the config and re-forced the
// default every launch, wiping the player's choice.) Every cvar here is menu-controlled.
// Non-option / forced / session cvars stay in autoexec.cfg (they must re-apply each launch).
// ============================================================================

seta cg_crosshairSize 0.5
seta cg_effectdetail 1    // fullest particle/effect density (engine default 0.2; also the Advanced GFX slider max)
seta cg_freecam 0
seta cg_marks_add 1         // wall bullet-hole / scorch decals ON (engine default 0)
seta cg_footprints 1        // boot prints in snow / mud / soft dirt (cgame cg_footprints.c; Graphics menu)
// [2026-08-31] 1100 -> 2048, the hard ceiling (MAX_TEMPMODELS, cgame/cg_commands.h:738).
// WHY: FreeSomeTempModels (cg_tempmodels.cpp:133-158) evicts from m_active_tempmodels.prev - the
// OLDEST particles first - the moment the active count passes max minus reserve.  At 1100/200 that
// was 900, and a long-lived emitter like the Omaha smoke screen always holds the oldest particles,
// so it was always first to be culled: the plume grew, hit the cap, collapsed, and regrew on a
// loop while impact effects around it took the budget.  It is a plain array of ctempmodel_t sized
// at MAX_TEMPMODELS regardless of this cvar (cg_commands.h:747), so raising it to the cap costs no
// memory at all - the slots are already allocated and were simply being left unused.
seta cg_max_tempmodels 4000
seta cg_reserve_tempmodels 200    // untouched; 200 of 4000 leaves the eviction line at 3800

// One-shot migration trigger for the line above. This file execs BEFORE the saved config, so this
// seed is what a never-migrated install carries into autoexec.cfg; a migrated one has its own
// config overwrite it with `vstr coop_fxPoolNone` and the raise never runs again. See the long
// note in autoexec.cfg. Value is a command, deliberately.
seta coop_fxPoolStep vstr coop_fxPoolDo
seta coop_fxPool2Step vstr coop_fxPool2Do   //[bug-2303] second raise, 2048 -> 4000
// [user 2026-09-13] BETTER SHADOWS + FOLIAGE SHADOWS (gl2). Seeds for a fresh profile; existing installs get the
// same values ONCE through coop_shadowUpStep (same bracket trick as coop_fxPoolStep, see autoexec.cfg), and
// anyone who lowers them afterwards keeps their choice. r_shadowMapSize and r_shadowFilter are CVAR_LATCH
// (renderergl2/tr_init.c), which is fine: both files exec before the renderer starts.
seta r_shadowMapSize 2048        // sun/character shadow cascade resolution (engine default 1024)
seta r_shadowFilter 2            // wider PCF soft edge (tr_glsl.c enables the second tap set at >= 2)
seta r_charShadowDist 1024       // real character shadows reach twice as far (engine default 512)
seta r_shadowCastFoliage 0       // [user 2026-09-18] foliage no longer casts into the sun cascades - tree shadows were the clearest bleed-through-ground offender
seta r_shadowMapBiasFactor 12    // [user 2026-09-21] raised 8->12: shadows still bled through walls/buildings/ground; a wider caster depth bias pushes the coarse cascades off the far side of occluders. If close/character shadows now detach (peter-pan), dial back toward 8.
seta r_shadowMapBiasUnits 12
seta coop_shadowUpStep vstr coop_shadowUpDo
seta coop_shadowFixStep vstr coop_shadowFixDo
seta coop_netFixStep vstr coop_netFixDo   //[bug-2909] one-time rate 60000 for installer-seeded profiles (autoexec.cfg)
// [user 2026-09-13] ACES GRADE BASELINE (bug-2584). The old daylight code wrote engine-default grade values
// and r_ppTonemap 0 into the SAVED config on the first frame of every map, so existing installs hold the
// Hable curve and a wiped grade rather than these seeds. A plain force here would fight a real user choice
// every launch (TRAPS T7), so this is the coop_fxPoolStep bracket again: seed the step to run the one-shot in
// autoexec.cfg once, restoring the intended ACES grade, after which the player owns the sliders again. See
// the long note in autoexec.cfg. (r_ppNight* is the non-archived night layer, seeded by engine code, not here.)
seta coop_acesGradeStep vstr coop_acesGradeDo
seta coop_bloomTuneStep vstr coop_bloomTuneDo
seta cg_shadows 2
seta cg_sprintLower 1
seta cg_tracerGlow 1.8
seta cg_weaponLag 0.7
seta coop_bloodTrail 1
seta coop_chalPopup 1
seta coop_goreDrip 1        // gore tier 2: looping blood drip on badly wounded humans + fresh corpses
seta coop_gorePool 1        // gore tier 2: corpse blood pool GROWS in steps instead of stamping full-size
seta coop_smokeWhip 1
seta coop_paraShootdownChance 7	// [user 2026-10-05] % chance flak downs one C-47 of a paradrop (fewer troopers); 0 = never
seta coop_paraGreaseChance 50	// [user 2026-10-12] % of paradrops in which the squad's SMG man carries an M3 grease gun instead of his Thompson; 0 = never
seta coop_tinnitus 1
seta coop_coverAuto 1		// [user 2026-08-09] auto take-cover (crouch+hold still = tuck in); 0 = keybind only
seta coop_hardcore 0		// [user 2026-09-25] Host Rules > Hardcore (latched per map; read by coop_mod/hardcore.scr)
seta coop_lmsLateJoin 1		// [user 2026-10-12] Host Rules > Late Joiners Can Spawn (Last Man Standing; 0 = a new player waits for the next mission)
seta coop_dbShotgun 1		// [dbshotgun 2026-10-13] the double-barrel shotgun is in the armory (server: 0 = its tile is hidden and the pick refused)
seta coop_loDbT "set coop_loP3d 1"	// [dbshotgun 2026-10-13] client side of the same switch: what the heavy tab runs to light the tile (the server re-sends it)
seta r_drawstaticdecals 1   // static world decals ON (engine default 0)
seta r_ext_compressed_textures 1
seta r_fastentlight 0       // HQ per-entity lighting (engine default 1 = cheap/fast) -> better-lit soldiers/props
seta r_grass 0
seta r_lodcap 1
seta r_lodscale 28
// [2026-10-11, bug-3483] DISTANT MODEL DETAIL (Advanced Graphics -> Geometry & Effects): Full / Reduced / Low.
// r_uselod cannot be archived (CVAR_TEMP), so the pick is kept in this ALIAS, which autoexec.cfg runs at every
// launch right after its own `set r_uselod 0`. This line is only the default (Full): the saved config stores
// aliases and loads after this file, so the player's pick replaces it. Same recipe as coop_fpsRestore below.
alias coop_lodRestore "set r_uselod 0"
// [2026-10-11, bug-3484] QUALITY PRESET (Advanced Graphics): the readout of the last preset applied. 1 Low, 2 Medium,
// 3 High (= every seed in this file, the shipped look), 4 Ultra, 0 Custom. Nothing reads it; the preset cfgs are
// coop_mod/cfg/gfx_preset_*.cfg, generated by docs/tools/gen_menu_graphics.py.
seta coop_gfxPreset 3
seta r_lodviewmodelcap 1
seta r_postProcess 1
seta r_ppBloom 1
seta r_ppBloomIntensity 0.550000
seta r_ppBloomThreshold 0.620000
// [user 2026-09-13] EXPOSURE-AWARE BLOOM (bug-1149). Mode 1 thresholds in the display domain of the active
// tone curve and blooms from a 16F half-res buffer, so only genuinely bright things glow and auto-exposure
// no longer dims the glow. Mode 0 is the byte-identical legacy pass, kept as a clean A/B (r_ppBloomMode 0).
// r_ppBloomMode is a NEW cvar nobody has archived, so this seed lands on fresh AND existing profiles.
seta r_ppBloomMode 1
seta r_ppBloomKnee 0.1
// [user 2026-09-13] render-scale supersampling + FSR 1. r_renderScale is LATCH/restart-only (bug-1181); default 1.0
// is byte-identical to no supersampling. r_upscaleFilter 1 = FSR EASU (<1) / quality downsample (>1); r_fsrSharpness
// drives RCAS and replaces r_ppSharpen while active. New cvars, so these seeds reach every profile.
seta r_renderScale 1.0
seta r_upscaleFilter 1
seta r_fsrSharpness 0.25
// [user 2026-09-13] soft particles: sprites depth-fade near geometry (no hard seam). LATCH; off = byte-identical.
seta r_softParticles 1
seta r_softParticleDistance 24
seta r_ppContrast 0.998567
// [user 2026-08-11] DEPTH OF FIELD BACK ON. The ghost/wash of bug-1629 had exactly ONE confirmed
// cause: this file shipped r_ppDoFFocus frozen at 744.985718, a focus plane leaked out of a
// tuning session, against an engine default of auto (tr_init.c:1490). That is fixed on the next
// line. r_ppDoF was ALSO switched off at the same time, so the focus fix has never once been
// tested on its own - the workaround was masking whether it was already sufficient. This turns
// the workaround off and leaves the fix in place, which is the plan's own step-6 discriminator
// (docs/proposals/postfx_ghost_plan.md): if the ghost stays away, S2 was the whole story.
// PROVISIONAL. If the ghost returns, suspect S1 (a stale/failed sceneDepth capture surfacing
// through the DoF leg) and revert with this one line while Tier-2 fix #7 instruments it.
// MENU-OWNED (ui/coop_postfx.urc), so this is only a DEFAULT: it does not move a player who
// already has a value archived - including you. Set it live in the Post-FX menu or console.
seta r_ppDoF 1
seta r_ppDoFFocus 0	// 0 = AUTO focus. Never re-seed a tuned plane here (bug-1629).
seta r_ppDoFIntensity 0.550143
seta r_ppDoFRange 2256.733643
seta r_ppExposure 0.700000
seta r_ppFXAA 1
seta r_ppGrade 0.000000
seta r_ppHeatHaze 1
seta r_ppLowHealth 1
seta r_ppMapGradeOn 1	//[per-map grade] player opt-out for the server-published per-map colour grade (1 = on, the default). A CLIENT-ONLY archived cvar: deliberately NOT coop_*, so a server cannot flip it (SEC2 refuses server sets of registered non-coop_ cvars). The renderer's r_ppMap* layer is non-archived and seeded by engine code, NOT here.
seta r_ppSSAO 1
seta r_ppSSAOBias 1.463324
seta r_ppSSAODepthAware 1
seta r_ppSSAOIntensity 0.618911
seta r_ppSSAORadius 21.243553
seta r_ppSaturation 1.083095
seta r_ppSunShaftIntensity 0.137536
seta r_ppSunShafts 1
seta r_ppSuppressAmount 0.55		//[user 08-02] was 0.068768 against a renderer default of 1.0, so EVERY suppression effect was being multiplied down to ~7% - which is why "suppression could be better". Raised to 0.55 as a middle setting rather than straight to 1.0, since the old value looks like a deliberate live-tune. Revert instantly with: seta r_ppSuppressAmount 0.068768
seta r_ppSuppression 1
seta r_ppTonemap 1
seta s_ambientvolume 0.6
seta s_musicvolume 0.9
seta s_volume 0.9
seta vss_draw 1             // volumetric smoke system ON (engine default 0) -> 3D smoke instead of flat sprites
seta vss_maxcount 22        // max simultaneous volumetric smoke puffs (engine default; lower if it ever costs FPS)

