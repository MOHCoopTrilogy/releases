seta coop_aiSlideChance 35
seta coop_aiRunfire 1
seta coop_aiCornerNade 18
seta coop_aiSuppressReact 45
seta coop_aiSurrenderChance 35
// [user 2026-08-18] retail long-range prone (attack.scr). 0 = instant kill-switch back to
