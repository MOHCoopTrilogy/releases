seta s_sfxvolume 1
seta s_cueDuck 2		// cue sidechain depth: 0 = off, 1 = moderate, 2 = default (music/ambience drop right out under the challenge + rank-up cues). Clamped so it cannot invert.
seta coop_coverViewRaise 25	// camera lift while in cover (3P only, peek exempt). 0 = stock crouched eye.
