// [user 2026-08-22] PROBE BUS - see coop_mod/probe.scr for channels and record format.
// MUST be seeded here: script getcvar CREATES an unregistered cvar EMPTY and permanently
// defeats any later engine default (bug-1669, which silently killed limping, tinnitus and
// gore-drip). coop_defaults.cfg execs BEFORE the saved config, so these are true defaults a
// console change overrides for the session without becoming an archived fossil.
// [user 2026-08-22] "Can you make those probes just start on their own please" - so the
// default is ON (129 = actor events + world census), not 0. Every session, and every bug
// report a player sends in, now arrives with full per-entity context instead of aggregate
// counters nobody can act on.
// INTERVAL 10, not 2: the census walks the entity table and emits one record per living
// actor, so it is the only part with a real cost. 10s is cheap and still catches state
// changes; drop it to 2 when actively hunting something, which is what a live repro wants.
// coop_probe 0 turns everything off.
// [user 2026-09-27] REVERSED FOR PLAY: "what probes/tests are still going when I play... flip the
// switch on them for now to cut the console spam". The census printed ~150 PRB lines a minute into
