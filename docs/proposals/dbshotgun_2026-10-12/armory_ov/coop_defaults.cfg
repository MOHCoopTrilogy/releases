// [user 07-29] AI-MANNED TURRET FEEL (Omaha MG42s "way too accurate").
// g_turret_spread is declared and registered in the engine with a default of 16 and then read by
// NOTHING - AI turrets have always fired at whatever the TIK carries, which for a mounted MG is
// effectively zero spread. Damage was already at 40% and it did not help, because 40% of a
// guaranteed hit is still a guaranteed hit. coop_mg42AiSpread is the missing half: a spread FLOOR
// (TIK bulletSpread units) applied to AI shots only - player-manned turrets keep full accuracy.
// m3l1b rear push: ranger health, and the manned-MG-nest geometry for build mode.
// Allies were on a flat 400 while the rear nav graph was dead and they never moved; once
// maps/m3l1b.pth let them actually advance, 400 did not survive the crossing.
seta coop_allyHealth 1500   // rangers on the m3l1b rear advance (sgt/lt get 1.5x)
seta coop_mgnestFwd 66      // build-mode manned MG nest: the gunner stands this far BEHIND the gun
seta coop_mgnestOnWall 46   // build-mode manned MG nest: gun distance in front of the sandbag origin (on the wall, 2026-09-25)
seta coop_mgnestAboveWall 6 // build-mode manned MG nest: gun height above the 52u sandbag top (coop_mgnestUp retired)
// MG42 gunners abandoning working emplacements the moment they spot you. Retail decided "should I
// keep this gun" with AI_CanTarget, an AIMING test against the turret's pitch caps - and the
// shipped nests set those to a ~25 degree window ("pitchcaps" "-15 10 0"), so a player barely off
// the barrel's height read as unengageable. They now hold the gun whenever there is a shot to be
// had. They now hold the emplacement until they are killed.
// Looted weapons hand over ONE MAGAZINE, not the deathmatch stockpile. coop runs g_gametype 2,
// so the engine only ever sees the tik's `dm startammo` - a dead German's Kar98 was worth 80
// rounds instead of 5. Also makes a weapon you already carry always takeable off a corpse.
// Bolt-action actors work their bolt between shots again. Retail shipped the rechamber block
// in anim/reload.scr COMMENTED OUT, so no AI has cycled a bolt since 2002. 2 = play the anim
// without blocking the actor (coop default - the retail path waits on every shot, which does
// not scale to a garrison shooting at four players). 1 = retail blocking. 0 = off.
seta coop_aiRechamber 2
seta coop_pickupOneMag 1    // 0 = retail deathmatch pickup amounts
// USE-TO-LOOT (2026-10-05). A gun an enemy drops is no longer picked up by walking over it: look at it and
// TAP Use to take the gun (its loaded magazine, nothing more) or HOLD Use to take one magazine of its ammo
// instead (the gun is used up). HOLD Use on an enemy body to search it - once per body, cancelled by moving,
// being hit, firing or letting go. Supply points, map-placed weapons and anything a player drops are unchanged.
// Co-op only; bots keep walking over guns. The odds are weights and need not add up to 100.
seta coop_lootUse 1         // master switch. 0 = the old rule everywhere: walk over an enemy's gun to take it
seta coop_lootSearch 1      // body search. 0 = guns and ammo only
seta coop_lootRange 80      // reach along the ground, in units
seta coop_lootCone 7        // how far off the crosshair a target may be, in degrees (near targets get more)
seta coop_lootHoldTime 0.5  // seconds of hold that turn "take the gun" into "take its ammo"
seta coop_lootSearchTime 1.75 // seconds of hold to search a body
seta coop_lootPNothing 50   // body search: nothing
seta coop_lootPAmmo 30      // body search: half to a whole magazine for one gun you carry
seta coop_lootPNade 12      // body search: one grenade of your own type
seta coop_lootPCanteen 8    // body search: one medkit (never under Hardcore)
// Placeable flak 88 (build mode, STRUCTURES). Fires a scripted shell at the closest LIVING
// player, re-picked every shot. Scatter is how far the round can land from him.
seta coop_flakInterval 6    // seconds between rounds
seta coop_flakScatter 160   // impact scatter in units; lower = deadlier
seta coop_mgStay 1          // gunners man their MG until death. 0 = retail (they bail once spotted)
seta coop_mgnestGunnerUp 0  // raises the GUNNER off the ground (coop_mgnestUp raises the GUN)
seta coop_mgnestPitch 60    // nest gunner's pitch cone. Outside it AI_CanTarget fails and he
                            // ABANDONS the gun to fight on foot. Stock TurretGun is 45; the BSP's
                            // own bunker nests are tighter still, which works only because you
                            // always approach those through the arc they cover.
// [user 2026-08-16] bug-1851 - SPREAD IS NOT ACCURACY, and the note above only got half of it.
// Spread scatters bullets around wherever the barrel points; AI_DoTargetAutoTrack pointed it at the
// enemy's centroid EXACTLY, every frame, so widening the cone still centred that cone on the
// player's chest. coop_mg42AiAimOff moves the AIM POINT: a random error re-rolled every 0.7-1.6s so
// a burst walks across the target and the gunner corrects between bursts. Scaled by range, so the
// value is world units of error per 1000u of distance. Higher = misses by more. 0 = vanilla.
// This is the knob to reach for first when MG42s feel laser-guided; damage is the blunter tool.
seta coop_mg42AiAimOff 100
// [user 2026-08-17] Scripted MG42 nests (mg42_active.scr - Omaha, m3l3's town) pick their aim
// offset from RANGE TIERS that start at 1801u, so a nest fought closer than that aims dead on the
// player with no scatter whatsoever. This multiplies the distance fed to that picker: 3.5 puts a
// ~520u engagement into the first tier. It does NOT change how far they can see or shoot.
seta coop_mg42AiRangeMult 3.5
seta coop_mg42AiSpread 300	// [user 2026-08-19] bug-1940: was a placebo at 45 (added to bulletspread, which manned-turret fire NEVER reads); now feeds m_vAIBulletSpread - uniform +-units at bulletrange 4000, retail e1l1 band 300-450
seta coop_mg42AiDamage 40
seta coop_phoneGag 1		// m1l2b: answering the ringing telephone plays the gag clip; 0 = leave it ringing (retail)
seta coop_build_angleStep 1	// build mode: yaw/pitch step in degrees (snap mode still forces 45)
seta coop_subEscape 1	// m2l2b: escape the U-boat and watch her go from the dock, instead of the 75s in-boat blast
seta coop_stealthStart 1	// m2l2a papers-only stealth route + the Phase C contain. ON 2026-08-10
			// once Phase C was verified end to end. NOTE autoexec.cfg force-sets this
			// too and is what actually decides - it execs AFTER the saved config
			// (TRAPS T7), so a player holding an archived 0 is only moved by that line.
seta coop_stealthNoAggro 0	// aggro-gate layer treats UNSET as ON; explicit 0 = HZM baseline
seta coop_disgAggroParity 1	// [2026-08-10] Phase A kill switch: 0 skips the disguise-deference gate in
			// aihandler.scr::attackPlayer for EVERY target and disables Step 4's scene-actor
			// exemptions - i.e. exactly the pre-Phase-A behaviour. Master plan v2 Step 0 / A0.
seta coop_stealthRecoverAlarm 1	// [2026-08-10] D1 kill switch: 0 makes an alarm strip disguises PERMANENTLY
			// (pre-D1 behaviour). Read by takeAllDisguises' permanent derivation in Phase C;
			// no reader yet. Seeded now so all five seed sites stay in sync.
seta coop_enigmaDecrypt 10	// m2l2b: seconds to decrypt the Enigma before it opens
// ----- [user 2026-08-10] Phase C, the player-initiated CONTAIN (coop_mod/bust.scr) -----
// Seeded here rather than left to a script fallback branch: an unseeded cvar makes getcvar return
// "" on a clean profile and a fallback silently decides behaviour, which is only "a default" in the
// loosest sense (TRAPS T7). All three are read by script ONLY - no engine Cvar_Get exists for them,
// so the bug-1669 empty-creation trap does not apply and these are safe to seed from a cfg.
seta coop_bustUseRange 112	// units from the officer within which "Press [USE] to Contain The Situation"
			// shows and the bash is guaranteed. ~9ft; the papers check happens closer than this.
seta coop_bustHintRange 400	// units at which the FIRST-CONTACT officer advisory fires. Far wider than
			// coop_bustUseRange on purpose - a warning delivered at bash range is a
			// caption, not a warning. Tested as a 2D distance plus a 96u vertical band,
			// so standing directly above him on another floor does NOT trigger it.
seta coop_bustHintTime 6	// seconds that advisory holds the DBNO line before it clears.
			// Once per player, and retired for good after a situation has been contained.
seta coop_bustStagger 4.5	// seconds the bashed officer is held in THINKSTATE_PAIN. This is the window to
			// put a silenced round in him; survive it and he gets up and raises it. Was 3.0 on
			// the first live run and the user could not finish him in time - the issued kit
			// takes ~1s to land, so the window has to comfortably outlast that.
seta coop_bustBashDamage 15	// damage the bash itself does. Must never be lethal - the PLAYER gets the kill.
seta coop_bustBashFloor 40	// the stun's re-hits stop at this % of the officer's starting health, so a long
			// stun can never finish him by attrition.
seta coop_bustClearTime 10	// seconds the body must go unseen after he drops before "Situation Contained".
			// User: "If after 10 seconds no one sees the body, you're clear."
// ----- the body outlives the containment: found AFTER the window = a local investigation -----
seta coop_bustBodyRadius 320	// units around the corpse that count as "hanging around" it (~27ft)
seta coop_bustBodyGrace 15	// seconds you may stay inside that radius while the finder investigates
			// before your cover is blown. Resets the moment you step out - it is a
			// LEAVING timer, so walking away always works and lingering never does.
seta coop_bustBodyLife 0	// seconds to keep HUNTING for someone to find the body (0 = the whole
			// mission). Bounds only the search: once the body HAS been found the area
			// stays under investigation for the rest of the map, which is both the right
			// fiction and cheaper - the cansee sweep stops the moment a finder latches.
// ----- m2l2a quiet Naxos sabotage -----
seta coop_naxosHold 2.5		// seconds of held USE to sabotage the Naxos quietly
seta coop_naxosRoomRadius 512	// units from the device that count as "in the Naxos room" - the range at
			// which you are told to wait for the scientists to be distracted. Distinct
			// from the 128u reach that actually arms the hold.

// ===== [user 2026-08-10] T1.1 - network defaults =====
// Placed HERE and not in autoexec.cfg on purpose: coop_defaults.cfg is exec'd BEFORE the saved
// player config, so these behave as defaults a player can override in the menu and keep.
// An autoexec seta runs AFTER the saved config and would clobber their choice every launch.
// Both are per-client and clamped by the engine; a host on a thin uplink can still set sv_maxRate.
// [user 2026-10-11, bug-3489] BEST CONNECTION FOR EVERYONE, NOT A CHOICE. rate 90000 is the most any unmodified
// server accepts (ours ignores it and sends at full rate anyway: sv_hzmClientRate); cl_maxpackets 100 sends this
// player's input to the host up to 100 times a second. autoexec.cfg re-applies all three at every launch, so an
// old saved config with a modem-era value cannot keep it.
seta rate 90000
seta cl_maxpackets 100
seta snaps 40
seta cl_timenudge 0

// [user 2026-08-10] profile-mirror channel probe (temporary; remove once the hop is proven)
// [2026-08-21] OFF FOR THE v1.4.0 RELEASE - marked "temporary; remove once the hop is
// proven" on 2026-08-10 and never turned back off.
seta coop_profProbe 0

// m3l3 church defence - wave pressure (see M3L3.scr::coop_churchWaves). These scale around a
// TWO-player baseline, so a solo player gets base - per, i.e. 14 - 5 = 9 attackers alive at once.
seta coop_chWaveBase 14      // attackers alive at the 2-player baseline
seta coop_chWavePer 5        // +/- per player away from that baseline
seta coop_chWaveCap 28       // hard ceiling however many players
seta coop_chWaveSend 8       // most one wave may spawn at once

// XP par-time bonus (xp.scr::xp_mission_bonuses). Seconds; 0 = no par set, no bonus. Opt-in per
// map - set it from the map script once a realistic clear time is known for that mission.
seta coop_xp_parTime 0

// ============================================================================
// GORE - decapitation, headshot faces, bullet holes, breath-hold accuracy
// ============================================================================
// DECAPITATION (game.dll Sentient::CoopGoreTryDecapitate). Explosive deaths - grenades,
// rockets, artillery, landmines, direct projectile hits - plus shotguns. Never bullets,
// never players. The severed head is the victim's own model in bind pose, so no new art.
// coop_decapBudget is the SAFETY VALVE, not a taste setting: it caps decaps per SERVER
// FRAME so one grenade into a count-scaled horde cannot spawn dozens at once, which is
// exactly what made the first attempt (bug-856) stutter every AI on the map.
seta coop_decap 1               // master on/off
seta coop_decapChance 30        // percent chance on a qualifying death (100 = always)
seta coop_decapBudget 3         // max decaps per server frame - do not raise casually
seta coop_decapLife 0           // 0 = heads persist like corpses; >0 = fade out after N seconds
seta coop_goreChunkLife 6       // seconds before thrown gore chunks fade. Was read off coop_decapLife,
                                // whose 0 above means "persist like corpses" - so chunks lingered 25s
                                // and read as debris floating around every body (bug-2191)
seta coop_goreWoundPivot 1      // 1 = wound patches centre on the hit and follow the bone (bug-2191);
                                // 0 = pre-fix behaviour, for A/B without a rebuild
seta coop_goreWoundScale 1.6   // size multiplier for the wound patches on bodies. 1 = the small
                                // original patch, 2 = double. Raised to 1.6 after the user reported
                                // wounds reading far too subtle (bug-2191)
seta coop_goreWoundProud 0.25  // how far a wound patch sits proud of the skin, in units. 0 = flush
                                // with the surface, 1 = the old value that read as floating above the
                                // clothes. Raise it only if wounds start disappearing INTO bodies.
seta coop_decapMax 32           // most severed heads alive at once; the oldest fades when exceeded
// [2026-08-21, pre-release audit] WAS 16, which silently DEFEATED the 2026-08-18 engine fix.
// sentient.cpp:3256 raised the default 16 -> 32 because the user reported "the heads disappear
// still"; 32 is COOP_DECAP_MAX_HEADS, the existing ring size. But the cvar is CVAR_ARCHIVE and
// this seed execs over it, so the shipped value stayed 16 and the fix never reached anyone.
// Same trap as the stale archived coop_mg42AiSpread 45 (caught live by TURSPREAD): when an
// engine default is corrected, the cfg seed for it has to move too or it is the seed that wins.

// SHOOTING THE DEAD (bug-1975). Standing rule: "all models should be susceptible to
// complete annihilation by shooting them even if dead." Bodies have been shootable since
// bug-1321, but Sentient::ArmorDamage returned immediately on any dead sentient, so every
// gore path on a corpse hit was unreachable - all a body did was bleed. With this on, a
// corpse still takes blood tiers, bullet holes, a disfigured face from a headshot, gib
// skins and a head off a blast. It NEVER takes health, pain, knockback or an AI reaction.
// coop_corpseGoreBudget is the safety valve, same idea as coop_decapBudget: wound props
// spawned per corpse hit are capped per SERVER FRAME, because emptying magazines into
// bodies is sustained and a shotgun blast is ~10 hits in one frame.
// RAGDOLLS. [user 2026-08-21] ON by default from v1.4.1. Verlet solver with angular joint
// limits, world + brush collision and per-bone radii; the authored death animation owns the
// fall and physics owns the landing. This seed execs BEFORE the saved config, so a player who
// sets coop_ragdoll 0 in console keeps it off across relaunches - which is the intent.
seta coop_ragdoll 1             // 0 = retail death animations only

seta coop_corpseGore 1          // master on/off for post-death gore
seta coop_corpseGoreBudget 6    // max corpse wound props spawned per server frame

// HEADSHOT FACE: a confirmed headshot KILL forces the head to the gib-tier (disfigured)
// face. Uses art that already shipped; ordinary damage still never paints a face.
seta coop_goreHeadshotFace 1

// BULLET HOLES (wound props). NOTE coop_goreWounds must be 1 or NO holes appear at all.
// coop_goreWoundMax is how many a single body carries; once full the OLDEST is recycled,
// so holes follow where you are shooting now instead of stopping after the first few.
seta coop_goreWounds 1
seta coop_goreWoundMax 8

// ARTERY SPURTS (game.dll Sentient::CoopGoreTryArtery) [gore phase A]. A bullet into the neck, an upper
// arm or a thigh of an ENEMY can open an artery: a jet pulses with the heartbeat (strong, then weaker)
// and leaves blood where it lands. A soldier who survives the hit BLEEDS OUT after coop_arteryBleedTime
// seconds - the kill is yours. Never players, never allies, never officers/bosses. Engine defaults match
// these seeds (bug-2017: change both or neither).
seta coop_artery 1              // master on/off (also needs com_blood 1)
seta coop_arteryChance 25       // % for a thigh hit; neck is x2, upper arm x0.6
seta coop_arteryBleedTime 8     // seconds until a hit soldier bleeds out; 0 = spurt only, never kills
seta coop_arteryMax 4           // most jets alive at once, all bodies together (ceiling 8)

// HOLD-BREATH ACCURACY: while aiming AND holding the walk key, semi-auto weapons tighten.
// This is a SPREAD MULTIPLIER, so LOWER is more accurate: 0.10 leaves a tenth of the cone,
// 1.0 disables the bonus. It expires with the breath budget (cg_breathHoldTime) and clears
// the moment you release, so it can never leave you permanently steady.
seta coop_breathAccuracy 0.10

// [user 2026-08-18] fire diagnostics OFF - the Panzerfaust was removed (bug-1907 closed as
// removed-by-user-call after the elimination campaign). Set 1 to print ReadyToFire values.
set coop_fireDebug 0

// [user 2026-08-18] AI animation batch: arrival slide roll (percent, personality time),
