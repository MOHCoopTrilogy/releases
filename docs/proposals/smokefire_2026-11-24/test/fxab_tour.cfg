// Smoke & fire Phase 0 - 5-minute test (TEST KIT ONLY - never shipped).
// In the console:  exec fxab_tour.cfg   then   spdevmap m5l2b   and wait for the map to load.
// F9  = play the effect tour in front of you (grenade, bazooka, heavy shell, stone blast, two fires, barracks blast)
// F10 = engine A/B: shadow views stop eating the sprite budget (1 = new, 0 = old). No visible change is expected
//       except in very heavy scenes; the console prints the sprite count every 2 s while r_hzmSpriteStats is 1.
// The content A/B (new grenade/bazooka, fire fades, sprite sizes, repaired effects) is the Phase 0 pak itself:
// run the tour once WITH zzzzzzzzzzzzz_coop_fx.pk3 from the test kit and once with your current one.
set cheats 1
bind F9 "testthread global/fxab_tour.scr main"
set fxab_skip 1
bind F10 "vstr fxab_t"
set fxab_t "vstr fxab_t0"
set fxab_t0 "set r_hzmShadowSpriteSkip 0; set fxab_t vstr fxab_t1; echo SPRITE A/B: OLD (shadow views add sprites)"
set fxab_t1 "set r_hzmShadowSpriteSkip 1; set fxab_t vstr fxab_t0; echo SPRITE A/B: NEW (shadow views skip sprites)"
set r_hzmSpriteStats 1
echo "fxab_tour: F9 = effect tour, F10 = sprite budget A/B. Now: spdevmap m5l2b"
