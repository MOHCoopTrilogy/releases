// MOH Coop Trilogy - gl2 upgrade preview  (OPT-IN - not shipped, not in any pk3)
//
// In-game:  exec tools/gl2_upgrades.cfg     (or it's the "gl2-upgraded" leg of gl2_ab_sweep.ps1)
//
// These are the confirmed one-cvar wins the opengl2 (rend2) backend unlocks over the gl1 build,
// from the "gl2 upgrades" analysis. This file only PREVIEWS them - it does NOT edit
// omconfig_default.cfg or autoexec.cfg, so player defaults stay untouched until you decide (after
// the A/B) what to actually ship.
//
// SEQUENCE: apply AFTER the fullbright defect fix. SSAO + sun shadows layered on a fullbright bug
// read wrong - that ordering is deliberate.
//
// cl_renderer only takes effect on a FRESH engine start: set it, then relaunch. Everything below
// it is a live cvar you can toggle from the console to A/B on the spot.

// --- select the modern renderer (requires restart) ---
seta cl_renderer "opengl2"

// --- already active for free under gl2 (verify these stay set) ---
seta r_hdr "1"              // gamma-correct HDR lighting
seta r_toneMap "1"          // filmic tonemap
seta r_autoExposure "1"     // eye adaptation (analysis: on under gl2)
seta r_depthPrepass "1"     // cleaner overdraw / perf
seta r_sunlightMode "1"     // real-time shadow-map machinery present + initialized
seta r_shadowMapSize "1024"
seta r_shadowFilter "1"

// --- the marquee win: real-time dynamic sun shadows (gl1 only has flat "blob" decals) ---
seta r_sunShadows "1"
// r_forceSun is an openmohaa/rend2 addition noted in the analysis (everything wired except the
// enable flag). Confirm it exists in your build (type `r_forceSun` in console). Casts actual
// moving sun shadows onto world AND characters; needs per-map sun dir/color/intensity tuning.
seta r_forceSun "1"

// --- genuine one-cvar flips ---
seta r_ssao "1"            // proper depth+normal ambient occlusion, FBO-based, zero assets
seta r_drawSunRays "1"     // god-rays / sun shafts through treelines & windows

// --- exposure / tonemap grade (already on; tune to taste). Names per the analysis - confirm in
//     your build before relying on them, hence left commented so this cfg never errors on exec.
// seta r_cameraExposure "1.0"
// seta r_forceToneMap "1"

// --- NOT flipped here (asset-gated content projects, per the analysis, not cvar flips):
//     normal/spec/parallax/PBR mapping (stock MOHAA has ~no _n/_s maps), deluxe mapping
//     (lightmaps predate deluxe data), cubemap reflections (need cubemap generation).

echo "gl2_upgrades.cfg applied - if cl_renderer changed to opengl2, restart the engine to load it"
